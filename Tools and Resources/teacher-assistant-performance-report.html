<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AISA | Teacher Assistant Performance Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="performance-review.css">
    <script src="../auth/gate.js?v=12"></script>
</head>
<body>
    <main id="form-root"></main>

    <script src="performance-review.js"></script>
    <script>
        renderPerformanceReview({
            formId: 'teacher-assistant-2025-26',
            title: 'Teacher Assistant Performance Report',
            subtitle: '2025 – 26',
            headerFields: [
                { label: 'Name of Employee' },
                { label: 'Name of Evaluator' },
                { label: 'Evaluation Date' }
            ],
            sections: [
                {
                    name: 'Professional Behavior',
                    criteria: [
                        'Reports to work on time (inc. breaks) and notifies of absence',
                        'Maintains an ethical and confidential environment',
                        'Addresses conflicts with teacher at the classroom level first, school level second',
                        'Makes a positive contribution to the school’s functions and activities',
                        'Maintains a professional appearance and demeanor',
                        'Seeks current information on issues relating to job (duties/exceptionalities)',
                        'Demonstrates flexibility to changes in schedules, work assignments, etc.'
                    ]
                },
                {
                    name: 'Relationship with Students',
                    criteria: [
                        'Shows enthusiasm, patience and understanding when working with students',
                        'Treats & interacts with students in a respectful, responsible and fair manner with due consideration to the students’ physical, social and emotional development',
                        'Maintains effective and cooperative relationships with students while being a positive role model',
                        'Demonstrates an understanding of, and an ability to implement, all aspects of the student’s program',
                        'Demonstrates a sense when a student in the class requires assistance'
                    ]
                },
                {
                    name: 'Team Support',
                    criteria: [
                        'Participates cooperatively when acting as a member of a school-based team',
                        'Shares relevant information with teacher / appropriate staff member',
                        'Communicates with parents as directed by the classroom teacher',
                        'Uses established communication systems with teachers and parents as directed, through documentation',
                        'Assists with school supervision duties'
                    ]
                },
                {
                    name: 'Instructional Support',
                    criteria: [
                        'Adapts materials as planned and directed by teacher',
                        'Demonstrates a sense of when the teacher requires assistance',
                        'Maintains awareness of goals and objectives of classroom teacher',
                        'Shares observations of children & provides feedback when necessary',
                        'Records required information on student activities as directed by the teacher',
                        'Helps students with assigned tasks and classwork, reinforcing concepts presented by the teacher',
                        'Monitors all students inside and outside of the classroom'
                    ]
                },
                {
                    name: 'Personal Attributes',
                    criteria: [
                        'Responds appropriately to constructive criticism',
                        'Continues to learn in this position',
                        'Shows initiative and ambition to achieve',
                        'Handles money and items of value appropriately',
                        'Expresses themselves well orally and in writing'
                    ]
                },
                {
                    name: 'Health and Safety',
                    criteria: [
                        'Understanding of school health and safety policies and procedures',
                        'Proactive in preventing safety risks in work area',
                        'Communicates safety concerns clearly and effectively',
                        'Responds calmly and professionally during incidents or emergencies'
                    ]
                }
            ],
            reflection: { label: 'The Employee’s Overall Reflection' }
        });
    </script>
</body>
</html>
